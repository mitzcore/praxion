<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>03_simstat</title>
<link rel="stylesheet" href="film.css">
<style>
  .stat { position: absolute; left: 310px; top: 150px; width: 1300px; height: 640px; padding: 64px 88px; }
  .stat .label { display: block; }
  .runid { text-transform: none; font-family: var(--mono); letter-spacing: 0.04em; color: var(--ink); }
  .rule-top { position: absolute; left: 88px; right: 88px; top: 120px; height: 1px; background: var(--line); }
  .big { position: absolute; left: 72px; top: 150px; font-size: 248px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; white-space: pre; }
  .big .pct { font-size: 140px; letter-spacing: 0; margin-left: 18px; color: var(--green); opacity: 0.85; }
  .meter { position: absolute; left: 88px; right: 88px; top: 432px; height: 10px; border-radius: 5px; background: var(--panel2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 5px; }
  .line { position: absolute; left: 88px; top: 478px; font-size: 44px; font-weight: 500; color: var(--ink); }
  .subline { position: absolute; left: 88px; top: 556px; font-size: 26px; color: var(--muted); letter-spacing: 0.01em; }
  .subline b { color: var(--green); font-weight: 600; }
  [data-anim].off { transform: translateY(14px); }
</style>
</head>
<body>
<div id="stage">
  <div id="card" class="card stat off" data-anim>
    <span class="label">Simulated tank · run <span class="runid">v13-s11</span></span>
    <div class="rule-top"></div>
    <div class="big num green"><span id="n"> 0.0</span><span class="pct">%</span></div>
    <div class="meter"><i id="bar"></i></div>
    <div id="line" class="line off" data-anim>less post-change error after the repair</div>
    <div id="sub" class="subline off" data-anim>same frozen hidden scenarios · <b>5 of 5</b> · zero safety violations</div>
  </div>
  <div class="src">docs/BENCHMARKS.md</div>
  <div class="brand">Praxion</div>
  <div id="cap0" class="cap"></div><div id="cap1" class="cap"></div>
</div>
<script src="diagram.js"></script>
<script>
  const ease = (p) => 1 - Math.pow(1 - Math.max(0, Math.min(1, p)), 3);
  const C0 = 0.5, C1 = 2.3, TARGET = 90.6;
  Diagram.run({
    name: "03_simstat",
    duration: 6,
    steps: [
      { t: 0, label: "card: simulated tank, run v13-s11", on: ["card"] },
      { t: 1.6, label: "line: less post-change error after the repair", on: ["line"] },
      { t: 2.6, label: "sub-line: 5 of 5 frozen hidden scenarios, zero violations", on: ["sub"] },
      { t: 6, label: "end" },
    ],
    tick(t) {
      const v = TARGET * ease((t - C0) / (C1 - C0));
      document.getElementById("n").textContent = v.toFixed(1).padStart(4, " ");
      document.getElementById("bar").style.width = v.toFixed(2) + "%";
    },
  });
</script>
</body>
</html>
