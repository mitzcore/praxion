<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>04_hwintro</title>
<link rel="stylesheet" href="film.css">
<style>
  .hw { position: absolute; left: 160px; top: 150px; width: 1600px; height: 660px; padding: 0; overflow: hidden; }
  .hw .text { position: absolute; left: 88px; top: 84px; width: 960px; }
  .hw .h2 { font-size: 64px; line-height: 1.08; margin: 26px 0 0 0; }
  .hw .h2 .muted { color: var(--muted); font-weight: 500; }
  .hw .body { margin-top: 40px; font-family: var(--mono); font-size: 25px; color: var(--muted); white-space: nowrap; }
  .hw .tagrow { position: absolute; left: 88px; bottom: 76px; }
  .hw .tagrow .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-right: 10px; vertical-align: 2px; }
  .art { position: absolute; right: 0; top: 0; width: 500px; height: 660px; border-left: 1px solid var(--line); background: var(--bg); }
  .art svg { position: absolute; left: -30px; top: 0; }
  .ln { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .ln.hot { stroke: var(--amber); }
  .ln.dim { stroke: var(--dim); }
  [data-anim].off { transform: translateY(14px); }
</style>
</head>
<body>
<div id="stage">
  <div id="card" class="card hw off" data-anim>
    <div class="text">
      <div id="lbl" class="label">Real hardware</div>
      <div id="h" class="h2 off" data-anim>A $50 heater board.<br><span class="muted">Nothing changed but the driver.</span></div>
      <div id="b" class="body off" data-anim>APMonitor TCLab · target 45 °C · band ±1.5 °C · 2026-11-03</div>
    </div>
    <div id="tg" class="tagrow off" data-anim><span class="tag green"><span class="dot"></span>Live Muse calls</span></div>
    <div class="art">
      <svg width="560" height="660" viewBox="0 0 560 660">
        <!-- board outline (line drawing, one colour; illustrative) -->
        <g id="board">
          <rect class="ln" x="90" y="150" width="380" height="380" rx="14"/>
          <!-- USB connector -->
          <rect class="ln dim" x="230" y="122" width="100" height="28" rx="3"/>
          <!-- two heater transistors (TO-220 shape) -->
          <g id="h1">
            <rect class="ln hot" x="150" y="250" width="100" height="120" rx="4"/>
            <circle class="ln hot" cx="200" cy="282" r="14"/>
            <path class="ln hot" d="M170 370 v40 M200 370 v40 M230 370 v40"/>
          </g>
          <g>
            <rect class="ln" x="310" y="250" width="100" height="120" rx="4"/>
            <circle class="ln" cx="360" cy="282" r="14"/>
            <path class="ln" d="M330 370 v40 M360 370 v40 M390 370 v40"/>
          </g>
          <!-- header pins -->
          <path class="ln dim" d="M130 480 h300"/>
          <path class="ln dim" d="M140 470 v20 M170 470 v20 M200 470 v20 M230 470 v20 M260 470 v20 M290 470 v20 M320 470 v20 M350 470 v20 M380 470 v20 M410 470 v20"/>
        </g>
        <!-- rising heat from heater 1 -->
        <g id="heat">
          <path id="w1" class="ln hot" d="M180 230 q-12 -18 0 -36 q12 -18 0 -36"/>
          <path id="w2" class="ln hot" d="M200 230 q-12 -18 0 -36 q12 -18 0 -36"/>
          <path id="w3" class="ln hot" d="M220 230 q-12 -18 0 -36 q12 -18 0 -36"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="src">docs/HARDWARE_RESULTS.md</div>
  <div class="brand">Praxion</div>
  <div id="cap0" class="cap"></div><div id="cap1" class="cap"></div>
</div>
<script src="diagram.js"></script>
<script>
  const clamp = (p) => Math.max(0, Math.min(1, p));
  const ease = (p) => 1 - Math.pow(1 - clamp(p), 3);
  const shapes = Array.from(document.querySelectorAll("#board .ln, #board circle"));
  const lens = shapes.map((s) => s.getTotalLength ? s.getTotalLength() : 1000);
  shapes.forEach((s, i) => { s.style.strokeDasharray = lens[i]; });
  const waves = ["w1", "w2", "w3"].map((id) => document.getElementById(id));
  Diagram.run({
    name: "04_hwintro",
    duration: 6,
    steps: [
      { t: 0, label: "card: REAL HARDWARE; board line drawing draws on", on: ["card"] },
      { t: 0.8, label: "h2: a $50 heater board, nothing changed but the driver", on: ["h"] },
      { t: 1.8, label: "body: TCLab, target 45 C, band 1.5 C, 2026-11-03", on: ["b"] },
      { t: 2.8, label: "tag: live Muse calls", on: ["tg"] },
      { t: 6, label: "end" },
    ],
    tick(t) {
      const p = ease((t - 0.2) / 1.8);
      shapes.forEach((s, i) => { s.style.strokeDashoffset = (lens[i] * (1 - p)).toFixed(1); });
      // heat lines fade in after the board is drawn, then settle (deterministic, ends static)
      waves.forEach((w, i) => {
        const q = ease((t - 2.2 - i * 0.25) / 0.8);
        w.style.opacity = (q * (0.55 + 0.15 * i)).toFixed(3);
        w.style.transform = "translateY(" + (12 * (1 - q)).toFixed(2) + "px)";
      });
    },
  });
</script>
</body>
</html>
